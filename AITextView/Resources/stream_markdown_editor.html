<!DOCTYPE html>
<html>
<head>
    <meta name="viewport" content="width=device-width,initial-scale=1.0,maximum-scale=1.0,user-scalable=no">
    <meta name="supported-color-schemes" content="light dark">
    <meta http-equiv="Content-Type" content="text/html; charset=UTF-8">
    <link rel="stylesheet" type="text/css" href="normalize.css">
    <link rel="stylesheet" type="text/css" href="style.css">
    <link rel="stylesheet" type="text/css" href="markdown.css">
    
    <!-- 引入 markdown-it -->
    <script src="https://cdn.jsdelivr.net/npm/markdown-it@14.0.0/dist/markdown-it.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-emoji@2.2.0/dist/markdown-it-emoji.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/markdown-it-code-copy@0.0.6/dist/markdown-it-code-copy.min.js"></script>
</head>
<body>
    <div id="container">
        <div id="editor" class="markdown-content"></div>
    </div>
    
    <script>
        // 流式 Markdown 处理器
        window.streamMarkdownProcessor = {
            md: null,
            currentContent: '',
            isStreaming: false,
            
            init() {
                // 初始化 markdown-it 实例
                this.md = window.markdownit({
                    html: true,
                    linkify: true,
                    typographer: true,
                    breaks: true
                });
                
                // 添加插件
                this.md.use(window.markdownItEmoji);
                this.md.use(window.markdownItCodeCopy, {
                    buttonClass: 'copy-code-button',
                    buttonText: '复制代码'
                });
                
                // 添加自定义渲染规则
                this.setupCustomRenderers();
            },
            
            setupCustomRenderers() {
                // 自定义代码块渲染
                this.md.renderer.rules.fence = (tokens, idx, options, env, renderer) => {
                    const token = tokens[idx];
                    const info = token.info ? this.md.utils.unescapeAll(token.info).trim() : '';
                    const langName = info ? info.split(/\s+/g)[0] : '';
                    const langClass = options.langPrefix + langName;
                    
                    return `<pre class="code-block"><code class="${langClass}">${token.content}</code></pre>`;
                };
                
                // 自定义表格渲染
                this.md.renderer.rules.table_open = () => '<div class="table-wrapper"><table class="markdown-table">';
                this.md.renderer.rules.table_close = () => '</table></div>';
            },
            
            updateMarkdown(newContent, isComplete) {
                this.currentContent += newContent;
                this.isStreaming = !isComplete;
                
                // 处理不完整的 Markdown
                let processedContent = this.currentContent;
                if (!isComplete) {
                    processedContent = this.handleIncompleteMarkdown(processedContent);
                }
                
                // 解析为 HTML
                const html = this.md.render(processedContent);
                
                // 更新显示
                this.updateDisplay(html, isComplete);
            },
            
            handleIncompleteMarkdown(content) {
                // 处理不完整的粗体
                content = content.replace(/(\*\*)([^*]*?)$/g, (match, p1, p2) => {
                    if (p2 && !/^[\s_~*`]*$/.test(p2)) {
                        return p1 + p2 + '**';
                    }
                    return match;
                });
                
                // 处理不完整的斜体
                content = content.replace(/(\*)([^*]*?)$/g, (match, p1, p2) => {
                    if (p2 && !/^[\s_~*`]*$/.test(p2)) {
                        return p1 + p2 + '*';
                    }
                    return match;
                });
                
                // 处理不完整的代码块
                const backtickCount = (content.match(/```/g) || []).length;
                if (backtickCount % 2 === 1) {
                    content += '```';
                }
                
                // 处理不完整的链接
                content = content.replace(/\[([^\]]*?)$/g, (match, p1) => {
                    if (p1 && !/^[\s]*$/.test(p1)) {
                        return match + '](streamdown:incomplete-link)';
                    }
                    return match;
                });
                
                return content;
            },
            
            updateDisplay(html, isComplete) {
                const editor = document.getElementById('editor');
                editor.innerHTML = html;
                
                // 添加流式更新样式
                if (!isComplete) {
                    editor.classList.add('streaming');
                } else {
                    editor.classList.remove('streaming');
                }
                
                // 滚动到底部
                this.scrollToBottom();
            },
            
            scrollToBottom() {
                const editor = document.getElementById('editor');
                editor.scrollTop = editor.scrollHeight;
            },
            
            reset() {
                this.currentContent = '';
                this.isStreaming = false;
                document.getElementById('editor').innerHTML = '';
            }
        };
        
        // 初始化
        document.addEventListener('DOMContentLoaded', () => {
            window.streamMarkdownProcessor.init();
        });
    </script>
</body>
</html>
